# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the main branch
  push:
    branches: [ main ]
  pull_request:
    branches: [ '**' ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  tests:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    strategy:
      matrix:
        PYTHON_VERSION: [ '3.10', '3.11', '3.12', '3.13' ]
        DJANGO_VERSION: [ '5.2.*' ]

    steps:
      - uses: actions/checkout@v4

      # docker-compose.yml owns the whole test setup (Postgres + install +
      # migrate + test), same as `make test` locally - this just parametrizes
      # the Python/Django versions the matrix varies.
      - name: Run tests via docker compose
        run: docker compose run --rm tests
        env:
          PYTHON_VERSION: ${{ matrix.PYTHON_VERSION }}
          DJANGO_VERSION: ${{ matrix.DJANGO_VERSION }}

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: tests/coverage.xml
          fail_ci_if_error: false

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run flake8 via docker compose
        run: docker compose run --rm lint
