services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  tests:
    image: python:${PYTHON_VERSION:-3.12}-slim
    working_dir: /app
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      DJANGO_VERSION: ${DJANGO_VERSION:-}
      DOCKER_UID: ${DOCKER_UID:-1000}
      DOCKER_GID: ${DOCKER_GID:-1000}
    command: >
      sh -c "pip install -q -e . &&
             pip install -q -r tests/requirements.txt &&
             if [ -n \"$$DJANGO_VERSION\" ]; then pip install -q \"Django==$$DJANGO_VERSION\"; fi &&
             cd tests &&
             python manage.py makemigrations &&
             python manage.py migrate --noinput &&
             coverage run manage.py test ${TEST_TARGET:-ajax_datatable} &&
             coverage xml;
             rc=$$?;
             chown -R $$DOCKER_UID:$$DOCKER_GID /app;
             exit $$rc"

  lint:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - .:/app
    command: sh -c "pip install -q flake8 && flake8"

  build:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - .:/app
    environment:
      DOCKER_UID: ${DOCKER_UID:-1000}
      DOCKER_GID: ${DOCKER_GID:-1000}
    command: >
      sh -c "pip install -q build && python -m build;
             rc=$$?;
             chown -R $$DOCKER_UID:$$DOCKER_GID dist build *.egg-info 2>/dev/null;
             exit $$rc"
